spring:
  config:
    import:
      - optional:file:.env[.properties]      #.env 파일 자동 로드

  application:
    name: musereview-backend

  # 공통 데이터베이스 접속 규칙 (실제 정보는 각자 .env나 application-prod에서 오버라이딩)
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mr_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  # 공통 JPA 및 하이버네이트 구동 설정
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_DDL_AUTO} # 배포 환경(prod)에선 validate로 덮어씌워짐
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # 파일 업로드 용량 제한
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

# Spring Security 및 JWT 인증 설정
jwt:
  secret: ${JWT_SECRET_KEY}
  access-token-validity-in-seconds: 1800     # Access Token 만료 시간 (30분)
  refresh-token-validity-in-seconds: 604800  # Refresh Token 만료 시간 (7일)

# 소셜 로그인 API 연동
oauth:
  
  kakao:
    client-id: ${KAKAO_CLIENT_ID:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_REDIRECT_URI}

  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI}

# AI 도입 및 AWS S3 공통 구조
external:
  ai:
    base-url: ${AI_BASE_URL:https://generativelanguage.googleapis.com}
    api-key: ${GEMINI_API_KEY:${AI_API_KEY:}}
    model: ${AI_MODEL:gemini-3-flash-preview}
    connect-timeout: ${AI_CONNECT_TIMEOUT:5s}
    read-timeout: ${AI_READ_TIMEOUT:120s}

aws:
  s3:
    bucket: ${AWS_S3_BUCKET:}
    region: ${AWS_REGION:ap-northeast-2}


# 내부 AI 분석 서버 설정
ai:
  internal:
    base-url: ${AI_INTERNAL_BASE_URL}
    connect-timeout: ${AI_INTERNAL_CONNECT_TIMEOUT:3s}
    read-timeout: ${AI_INTERNAL_READ_TIMEOUT:30s}
    endpoints:
      analyze: ${AI_INTERNAL_ANALYZE_ENDPOINT}

# 프로필 관련 공통 설정
app:
  profile:
    default-image-url: ${DEFAULT_PROFILE_IMAGE_URL:}
