spring:
  config:
    import:
      - optional:file:.env[.properties]      #.env 파일 자동 로드

  application:
    name: musereview-backend

  flyway:
    enabled: false

  # 공통 데이터베이스 접속 규칙
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/mr_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
      leak-detection-threshold: 20000

  # 공통 JPA 및 하이버네이트 구동 설정
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_DDL_AUTO:validate}
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # 레디스 설정 (develop 브랜치)
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      connect-timeout: ${SPRING_DATA_REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:2s}

  # 파일 업로드 용량 제한
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

# Actuator 엔드포인트 설정 (develop 브랜치)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

# Spring Security 및 JWT 인증 설정
jwt:
  secret: ${JWT_SECRET_KEY}
  access-token-validity-in-seconds: 1800     # Access Token 만료 시간 (30분)
  refresh-token-validity-in-seconds: 604800  # Refresh Token 만료 시간 (7일)

# 소셜 로그인 API 연동
oauth:
  kakao:
    client-id: ${KAKAO_CLIENT_ID:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/login/oauth2/code/kakao}

  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}

# AI 도입 및 AWS S3 공통 구조
external:
  ai:
    base-url: ${AI_BASE_URL:}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:}

aws:
  s3:
    bucket: ${AWS_S3_BUCKET:}
    region: ${AWS_REGION:ap-northeast-2}
    credentials:
      access-key: ${AWS_S3_ACCESS_KEY:dummy-access}
      secret-key: ${AWS_S3_SECRET_KEY:dummy-secret}
    presigned-url-expiration: 10m
    max-file-size: 31457280      # 30MB
    key-prefix: recordings
    allowed-content-types:
      - audio/mpeg
      - audio/wav
      - audio/x-wav
      - audio/webm
      - audio/ogg

# 내부 AI 분석 서버 설정
ai:
  internal:
    base-url: ${AI_INTERNAL_BASE_URL:http://localhost:8000}
    connect-timeout: ${AI_INTERNAL_CONNECT_TIMEOUT:5s}
    read-timeout: ${AI_INTERNAL_READ_TIMEOUT:60s}
    endpoints:
      analyze: ${AI_INTERNAL_ANALYZE_ENDPOINT:/analyze}

# 프로필 관련 공통 설정
app:
  profile:
    default-image-url: ${DEFAULT_PROFILE_IMAGE_URL:}