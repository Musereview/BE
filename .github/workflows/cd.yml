name: MuseReview Backend CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build JAR
        run: ./gradlew clean bootJar -x test

      - name: Prepare app.jar for Docker build context
        run: | 
          rm -f app.jar
          cp build/libs/*.jar ./app.jar

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/musereview:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/musereview:${{ github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get GitHub Actions runner public IP
        id: runner-ip
        run: |
          RUNNER_IP=$(curl -sS https://checkip.amazonaws.com)
          echo "ip=${RUNNER_IP}" >> "$GITHUB_OUTPUT"
          echo "Runner IP: ${RUNNER_IP}"
          
          echo "ip=$(curl -s https://checkip.amazonaws.com)/32" >> "$GITHUB_OUTPUT"

      - name: Allow runner SSH access
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id "${{ secrets.EC2_SECURITY_GROUP_ID }}" \
            --protocol tcp \
            --port 22 \
            --cidr "${{ steps.runner-ip.outputs.ip }}/32"


      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
              -u "${{ secrets.DOCKERHUB_USERNAME }}" \
              --password-stdin

            echo "===Updating ANALYSIS Repository==="  
            if [ ! -d "$HOME/ANALYSIS/.git" ]; then
              git clone https://github.com/Musereview/ANALYSIS.git "$HOME/ANALYSIS"
            else
              cd "$HOME/ANALYSIS"
              git fetch origin 
              git checkout main
              git reset --hard origin/main
            fi

            echo "===Updating BE Repository==="
            if [ ! -d "$HOME/BE/.git" ]; then
              git clone https://github.com/Musereview/BE.git "$HOME/BE"
            else
              cd "$HOME/BE"
              git fetch origin
              git checkout main
              git reset --hard origin/main
            fi

            echo "===Docker Compose Deploy==="
            cd "$HOME/BE"

            docker compose config --quiet
            docker compose pull backend
            docker compose build analysis
            docker compose up -d --remove-orphans

            docker compose ps
            docker image prune -f

      - name: Revoke runner SSH access
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "${{ secrets.EC2_SECURITY_GROUP_ID }}" \
            --protocol tcp \
            --port 22 \
            --cidr "${{ steps.runner-ip.outputs.ip }}/32" \
          || true
