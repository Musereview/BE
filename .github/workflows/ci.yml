name: MuseReview Backend CI

# develop 또는 main 브랜치로 PR 생성·업데이트 시 실행
on:
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - synchronize
      - reopened

  # develop 브랜치에 직접 push될 때 실행
  push:
    branches:
      - develop

# 저장소 코드 읽기 권한만 부여
permissions:
  contents: read

# 같은 브랜치에서 새 CI가 실행되면 기존 실행 취소
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Spring Boot 테스트 프로필 사용
env:
  SPRING_PROFILES_ACTIVE: test

  # PostgreSQL
  SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/mr_db
  SPRING_DATASOURCE_USERNAME: postgres
  SPRING_DATASOURCE_PASSWORD: postgres

  # Redis
  REDIS_HOST: localhost
  REDIS_PORT: 6379

  # JWT
  JWT_SECRET: musereview_backend_ci_test_jwt_secret_key_123456789
  JWT_ACCESS_TOKEN_EXPIRE_TIME: 3600000
  JWT_REFRESH_TOKEN_EXPIRE_TIME: 2592000000

  # AI
  GEMINI_API_KEY: dummy_gemini_api_key
  AI_INTERNAL_BASE_URL: http://localhost:8001

  # OAuth - Kakao
  KAKAO_CLIENT_ID: dummy_kakao_client_id
  KAKAO_CLIENT_SECRET: dummy_kakao_client_secret
  KAKAO_REDIRECT_URI: http://localhost:8080/api/auth/kakao/callback

  # OAuth - Google
  GOOGLE_CLIENT_ID: dummy_google_client_id
  GOOGLE_CLIENT_SECRET: dummy_google_client_secret
  GOOGLE_REDIRECT_URI: http://localhost:8080/api/auth/google/callback

jobs:
  build:
    name: Build Spring Boot
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mr_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d mr_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # 저장소 코드 가져오기
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # JDK 17 설치 및 Gradle 의존성 캐시 적용
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # Gradle Wrapper 실행 권한 부여
      - name: Grant execute permission
        run: chmod +x gradlew

      # 빌드 + 테스트
      - name: Build and Test with Gradle
        run: ./gradlew clean build -x checkFormatMain -x checkFormatTest

      # 테스트 실패 시 콘솔에 실패 요약 출력
      - name: Print test failure summary
        if: failure()
        run: |
          echo "=========================================="
          echo "             TEST FAILURES                "
          echo "=========================================="

          if [ -d "build/test-results/test" ]; then
            find build/test-results/test \
              -type f \
              -name "*.xml" \
              -exec grep -H -A 10 -E "<failure|<error" {} + \
              || echo "No direct failure tags found."
          else
            echo "No test results directory found."
          fi

      # 테스트 실패 시 HTML 리포트 및 XML 결과를 아티팩트로 업로드
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/test/
            build/test-results/test/
          retention-days: 7
          if-no-files-found: warn
