services:
  postgres:
    image: postgres:16
    container_name: musereview-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: mr_db
      POSTGRES_USER: musereview
      POSTGRES_PASSWORD: musereview1234
    volumes:
      - musereview-postgres-data:/var/lib/postgresql/data

volumes:
  musereview-postgres-data:
