services:
  backend:
    image: ${DOCKERHUB_USERNAME}/musereview:latest
    container_name: musereview-be
    restart: unless-stopped
    
    env_file:
      - .env
        
    environment:
      TZ: Asia/Seoul
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
        
    ports:
      - "127.0.0.1:8080:8080"
